services:
  app:
    build: .
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_URL: mongodb://mongo:27017/OrbitOps
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - 27017:27017
    volumes: 
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
